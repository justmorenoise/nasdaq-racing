<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Nasdaq Racing</title>
    <meta
      name="description"
      content="The top Nasdaq 100 stocks race as F1 cars on real circuits: the daily % change sets each car's lap time."
    />
    <style>
      /* Loading screen: inline so it paints before any script or stylesheet. */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #2b3440 0%, #12161c 70%);
        color: #f1efe8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.6s ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader .ld-flag {
        width: 220px;
        height: 14px;
        background: repeating-conic-gradient(#f1efe8 0 25%, #1c1e22 0 50%) 0 0 / 14px 14px;
        border-radius: 3px;
        animation: ld-wave 1.2s linear infinite;
        opacity: 0.9;
      }
      @keyframes ld-wave {
        to {
          background-position: 28px 0;
        }
      }
      #loader .ld-title {
        font-size: 13px;
        letter-spacing: 0.32em;
        font-weight: 700;
        color: #e6b422;
      }
      #loader .ld-track {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-align: center;
        padding: 0 16px;
      }
      #loader .ld-bar {
        width: min(320px, 70vw);
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #loader .ld-fill {
        height: 100%;
        width: 4%;
        background: linear-gradient(90deg, #c8412f, #e6b422);
        border-radius: 3px;
        transition: width 0.35s ease;
      }
      #loader .ld-step {
        font-size: 12px;
        color: rgba(241, 239, 232, 0.7);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="ld-title">NASDAQ GRAND PRIX</div>
      <div class="ld-track"></div>
      <div class="ld-flag"></div>
      <div class="ld-bar"><div class="ld-fill"></div></div>
      <div class="ld-step"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
